/* sections below map */
.section{margin-top:2rem}

.section h2{font-family:var(--font-display);font-size:1.125rem;font-weight:600}

.hidden-list{margin:.5rem 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.5rem}
.hidden-list button{border-radius:.375rem;background:var(--surface);padding:.375rem .625rem;font-size:.75rem;font-weight:500;box-shadow:inset 0 0 0 1px var(--border)}
textarea.json{margin-top:.5rem;width:100%;border-radius:.5rem;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.75rem;font-family:ui-monospace,monospace;font-size:.75rem;line-height:1.625}

<body>
<main id="app"></main>
<script>
"use strict";
/* ===== カタログ（既存版 catalog.ts と同一） ===== */
const INGREDIENTS=[
 {id:"chicken",label:"鶏",searchWord:"鶏肉"},
 {id:"pork",label:"豚",searchWord:"豚肉"},
 {id:"beef",label:"牛",searchWord:"牛肉"},
 {id:"fish",label:"魚",searchWord:"魚"},
 {id:"egg-tofu",label:"卵・豆腐",searchWord:"豆腐"},
 {id:"veg",label:"野菜",searchWord:"野菜"}
];
const METHODS=[
 {id:"grill",label:"焼く",searchWord:"焼く"},
 {id:"simmer",label:"煮る",searchWord:"煮る"},
 {id:"stirfry",label:"炒める",searchWord:"炒める"},
 {id:"fry",label:"揚げる",searchWord:"揚げる"},
 {id:"steam-mix",label:"蒸す・和える",searchWord:"蒸す"},
 {id:"soup",label:"汁物",searchWord:"汁物"}
];
function d(id,name,ingredient,method){return{id:id,name:name,ingredient:ingredient,method:method};}
const DISHES=[
 d("chicken-teriyaki","鶏の照り焼き","chicken","grill"),
 d("oyakodon","親子丼","chicken","simmer"),
 d("chicken-pepper-stirfry","鶏とピーマンの炒め物","chicken","stirfry"),
 d("karaage","鶏の唐揚げ","chicken","fry"),
 d("chicken-nanban","チキン南蛮","chicken","fry"),
 d("bangbangji","バンバンジー","chicken","steam-mix"),
 d("chicken-dumpling-soup","鶏団子スープ","chicken","soup"),
 d("buta-shogayaki","豚の生姜焼き","pork","grill"),
 d("buta-kakuni","豚の角煮","pork","simmer"),
 d("butabara-daikon","豚バラ大根","pork","simmer"),
 d("hoikoro","回鍋肉","pork","stirfry"),
 d("buta-kimchi","豚キムチ炒め","pork","stirfry"),
 d("tonkatsu","とんかつ","pork","fry"),
 d("reishabu","冷しゃぶサラダ","pork","steam-mix"),
 d("tonjiru","豚汁","pork","soup"),
 d("hamburg","ハンバーグ","beef","grill"),
 d("beef-steak","ビーフステーキ","beef","grill"),
 d("gyudon","牛丼","beef","simmer"),
 d("beef-stew","ビーフシチュー","beef","simmer"),
 d("chinjao-rosu","青椒肉絲","beef","stirfry"),
 d("menchi-katsu","メンチカツ","beef","fry"),
 d("roast-beef","ローストビーフ","beef","steam-mix"),
 d("beef-tail-soup","牛テールスープ","beef","soup"),
 d("sake-shioyaki","鮭の塩焼き","fish","grill"),
 d("buri-teriyaki","ぶりの照り焼き","fish","grill"),
 d("saba-misoni","さばの味噌煮","fish","simmer"),
 d("sakana-ankake","白身魚の野菜あんかけ","fish","stirfry"),
 d("aji-fry","アジフライ","fish","fry"),
 d("sakana-hoil-yaki","魚のホイル焼き","fish","steam-mix"),
 d("arajiru","あら汁","fish","soup"),
 d("tamagoyaki","卵焼き","egg-tofu","grill"),
 d("omurice","オムライス","egg-tofu","grill"),
 d("nikudofu","肉豆腐","egg-tofu","simmer"),
 d("mabo-dofu","麻婆豆腐","egg-tofu","stirfry"),
 d("goya-champuru","ゴーヤチャンプルー","egg-tofu","stirfry"),
 d("agedashi-dofu","揚げ出し豆腐","egg-tofu","fry"),
 d("chawanmushi","茶碗蒸し","egg-tofu","steam-mix"),
 d("hiyayakko","冷奴","egg-tofu","steam-mix"),
 d("tofu-misoshiru","豆腐の味噌汁","egg-tofu","soup"),
 d("nasu-dengaku","なすの田楽","veg","grill"),
 d("kabochano-nimono","かぼちゃの煮物","veg","simmer"),
 d("hijiki-nimono","ひじきの煮物","veg","simmer"),
 d("yasai-itame","野菜炒め","veg","stirfry"),
 d("kinpira","きんぴらごぼう","veg","stirfry"),
 d("yasai-tempura","野菜の天ぷら","veg","fry"),
 d("onyasai","温野菜","veg","steam-mix"),
 d("ohitashi","ほうれん草のおひたし","veg","steam-mix"),
 d("kenchin-jiru","けんちん汁","veg","soup")
];
function ingredientOf(id){return INGREDIENTS.find(i=>i.id===id)||INGREDIENTS[0];}
function methodOf(id){return METHODS.find(m=>m.id===id)||METHODS[0];}
function cellKeyword(ing,met){return ingredientOf(ing).searchWord+" "+methodOf(met).searchWord+" 簡単 レシピ";}
function cellLabel(ing,met){return ingredientOf(ing).label+" × "+methodOf(met).label;}
const STATE_LABEL={can:"作れる",never:"作ったことない"};
function toggled(s){return s==="can"?"never":"can";}

/* ===== 保存（localStorage のみ。サーバー通信は一切しない） ===== */
const STORAGE_KEY="ryouri-repertoire-check:v1";
let marks=new Map();        // dishId -> {state:"can"|"never"|null, hidden:boolean}
let customDishes=[];        // [{id,name,ingredient,method}]
function save(){
  const payload={marks:Array.from(marks.entries()).map(([dishId,m])=>({dishId:dishId,state:m.state,hidden:!!m.hidden})),customDishes:customDishes};
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));}catch(e){/* 保存できない環境では画面内のみで継続 */}
}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const parsed=JSON.parse(raw);
    if(parsed&&Array.isArray(parsed.marks)){
      for(const m of parsed.marks){
        if(m&&typeof m.dishId==="string")marks.set(m.dishId,{state:(m.state==="can"||m.state==="never")?m.state:null,hidden:m.hidden===true});
      }
    }
    if(parsed&&Array.isArray(parsed.customDishes)){
      customDishes=parsed.customDishes.filter(c=>c&&typeof c.id==="string"&&typeof c.name==="string"&&typeof c.ingredient==="string"&&typeof c.method==="string");
    }
  }catch(e){marks=new Map();customDishes=[];}
}
function newCustomDishId(){
  const rand=(window.crypto&&"randomUUID" in window.crypto)?window.crypto.randomUUID().replace(/-/g,"").slice(0,12):Math.random().toString(36).slice(2,14);
  return "custom-"+Date.now().toString(36)+"-"+rand;
}

/* ===== 画面状態 ===== */
let organizing=false,picked=null,lineTarget=null,copied=false,copyFailed=false,confirmReset=false;
let exportJson=null,exportCopied=false,exportError=null;
let importText="",importError=null,importDone=null,confirmImport=false;
let addCell=null,addName="",addError=null;
let editingCustom=null,editName="",editIngredient="",editMethod="",editError=null,confirmDeleteCustom=false;

/* ===== 派生データ ===== */
function customIds(){return new Set(customDishes.map(x=>x.id));}
function allDishes(){return DISHES.concat(customDishes);}
function stateOf(id){const m=marks.get(id);return (m&&m.state)||"never";}
function isHidden(id){const m=marks.get(id);return !!(m&&m.hidden);}
function visibleDishes(){return allDishes().filter(x=>!isHidden(x.id));}
function hiddenDishes(){return allDishes().filter(x=>isHidden(x.id));}
function dishesInCell(cell){return visibleDishes().filter(x=>x.ingredient===cell.ingredient&&x.method===cell.method);}
function inLine(dish,line){return line.axis==="ingredient"?dish.ingredient===line.lineId:dish.method===line.lineId;}
function dishesInLine(line){return visibleDishes().filter(x=>inLine(x,line));}
function hiddenInLine(line){return hiddenDishes().filter(x=>inLine(x,line));}
function isThin(cell){const ds=dishesInCell(cell);return ds.length>0&&!ds.some(x=>stateOf(x.id)==="can");}
function isEmpty(cell){return dishesInCell(cell).length===0;}
function allCells(){const out=[];for(const i of INGREDIENTS)for(const m of METHODS)out.push({ingredient:i.id,method:m.id});return out;}
function thinCells(){return allCells().filter(isThin);}
function emptyCells(){return allCells().filter(isEmpty);}
function blankCells(){return thinCells().concat(emptyCells());}
function counts(){const v=visibleDishes();let can=0;for(const x of v)if(stateOf(x.id)==="can")can++;return{can:can,never:v.length-can,total:v.length};}

/* ===== 変更操作（すべてローカルで即時完了） ===== */
function patchMark(dishId,patch){
  const cur=marks.get(dishId)||{state:null,hidden:false};
  marks.set(dishId,{state:("state" in patch)?patch.state:cur.state,hidden:("hidden" in patch)?patch.hidden:cur.hidden});
}
function setStates(ids,state){for(const id of ids)patchMark(id,{state:state});save();render();}
function setHiddenFlags(ids,hidden){for(const id of ids)patchMark(id,{hidden:hidden});save();render();}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true;}
  catch(e){
    try{
      const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");document.body.removeChild(ta);return ok;
    }catch(e2){return false;}
  }
}
function scrollToEl(el){
  if(!el)return;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"});
}

/* ===== DOM ヘルパー ===== */
function el(tag,cls,text){
  const n=document.createElement(tag);
  if(cls)n.className=cls;
  if(text!=null)n.textContent=text;
  return n;
}
function btn(cls,text,onClick,attrs){
  const b=el("button",cls,text);
  b.type="button";
  if(attrs)for(const k in attrs){
    if(k==="disabled")b.disabled=!!attrs[k];
    else if(k==="ariaLabel")b.setAttribute("aria-label",attrs[k]);
    else if(k==="ariaPressed")b.setAttribute("aria-pressed",attrs[k]);
    else b.setAttribute(k,attrs[k]);
  }
  if(onClick)b.addEventListener("click",onClick);
  return b;
}

/* ===== 操作ハンドラ ===== */
function onChipTap(dish){
  if(organizing){
    if(customIds().has(dish.id)){
      const c=customDishes.find(x=>x.id===dish.id);
      if(c)openEditCustom(c);
      return;
    }
    setHiddenFlags([dish.id],true);
    return;
  }
  setStates([dish.id],toggled(stateOf(dish.id)));
}
function openLine(line){picked=null;lineTarget=line;render();scrollToEl(document.getElementById("line-panel"));}
function applyLineState(state){
  if(!lineTarget)return;
  const ids=dishesInLine(lineTarget).map(x=>x.id);
  if(ids.length===0)return;
  setStates(ids,state);
}
function applyLineHidden(hidden){
  if(!lineTarget)return;
  const src=hidden?dishesInLine(lineTarget):hiddenInLine(lineTarget);
  const ids=src.map(x=>x.id);
  if(ids.length===0)return;

/* ===== 読み込み（検証＋差分方式。既存版 parseImport と同じ検証） ===== */
function parseImport(){
  let parsed;
  try{parsed=JSON.parse(importText);}
  catch(e){return{error:"JSONとして読み取れませんでした。書き出した内容をそのまま貼ってください。"};}
  const rawMarks=Array.isArray(parsed)?parsed:(parsed?parsed.marks:undefined);
  if(!Array.isArray(rawMarks))return{error:"記録の配列（marks）が見つかりませんでした。書き出したJSONを使ってください。"};
  const rawCustoms=Array.isArray(parsed)?undefined:(parsed?parsed.customDishes:undefined);
  const nextCustoms=[];
  if(rawCustoms!==undefined){
    if(!Array.isArray(rawCustoms))return{error:"自分の料理の配列（customDishes）の形式が正しくありません。"};
    if(rawCustoms.length>200)return{error:"自分の料理が多すぎます（上限200品）。"};
    const ingredientIds=new Set(INGREDIENTS.map(i=>i.id));
    const methodIds=new Set(METHODS.map(m=>m.id));
    const presetIds=new Set(DISHES.map(x=>x.id));
    const presetNames=new Set(DISHES.map(x=>x.name));
    const seenIds=new Set(),seenNames=new Set();
    for(const entry of rawCustoms){
      if(typeof entry!=="object"||entry===null)return{error:"自分の料理の形式が違う行があります。"};
      const id=entry.id,name=entry.name,ingredient=entry.ingredient,method=entry.method;
      if(typeof id!=="string"||id.length===0||id.length>80||!id.startsWith("custom-")||presetIds.has(id))return{error:"自分の料理のIDの形式が正しくありません。"};
      if(typeof name!=="string"||name.trim().length===0||name.trim().length>40)return{error:"自分の料理の名前が正しくありません（1〜40文字）。"};
      if(typeof ingredient!=="string"||!ingredientIds.has(ingredient))return{error:"自分の料理「"+name+"」の主材が正しくありません。"};
      if(typeof method!=="string"||!methodIds.has(method))return{error:"自分の料理「"+name+"」の調理法が正しくありません。"};
      if(seenIds.has(id))return{error:"自分の料理のIDが重複しています。"};
      if(presetNames.has(name.trim())||seenNames.has(name.trim()))return{error:"料理名「"+name.trim()+"」が重複しています。"};
      seenIds.add(id);seenNames.add(name.trim());
      nextCustoms.push({id:id,name:name.trim(),ingredient:ingredient,method:method});
    }
  }
  const knownIds=new Set();
  for(const x of DISHES)knownIds.add(x.id);
  for(const x of nextCustoms)knownIds.add(x.id);
  for(const x of customDishes)knownIds.add(x.id);
  const seen=new Set(),nextMarks=[];
  for(const entry of rawMarks){
    if(typeof entry!=="object"||entry===null)return{error:"記録の形式が違う行があります。"};
    const dishId=entry.dishId,state=entry.state,hidden=entry.hidden;
    if(typeof dishId!=="string"||!knownIds.has(dishId))return{error:"このツールにない料理IDが含まれています（"+(typeof dishId==="string"?dishId:"不明")+"）。"};
    if(state!=="can"&&state!=="never"&&state!==null&&state!==undefined)return{error:"「"+dishId+"」の状態の値が正しくありません。"};
    if(hidden!==undefined&&typeof hidden!=="boolean")return{error:"「"+dishId+"」の表示フラグの値が正しくありません。"};
    if(seen.has(dishId))continue;
    seen.add(dishId);
    nextMarks.push({dishId:dishId,state:(state==null?null:state),hidden:hidden===true});
  }
  return{marks:nextMarks,customDishes:nextCustoms};
}
function effectiveState(s){return s==null?"never":s;}
function importTarget(importedMarks,importedCustoms,currentCustoms){
  const byId=new Map(importedMarks.map(m=>[m.dishId,m]));
  const importedIds=new Set(importedCustoms.map(x=>x.id));
  const universe=DISHES.concat(importedCustoms,currentCustoms.filter(x=>!importedIds.has(x.id)));
  return universe.map(x=>{
    const m=byId.get(x.id);
    return m?{dishId:x.id,state:m.state,hidden:m.hidden}:{dishId:x.id,state:null,hidden:false};
  });
}
function applyImport(payload){
  // 自分の料理の差分（追加・変更・削除）
  const currentById=new Map(customDishes.map(x=>[x.id,x]));
  const importedIds=new Set(payload.customDishes.map(x=>x.id));
  let customSteps=0;
  for(const c of payload.customDishes){
    const cur=currentById.get(c.id);
    if(!cur||cur.name!==c.name||cur.ingredient!==c.ingredient||cur.method!==c.method)customSteps++;
  }
  for(const c of customDishes)if(!importedIds.has(c.id))customSteps++;
  // 記録の差分
  const target=importTarget(payload.marks,payload.customDishes,customDishes);
  const diff=target.filter(t=>{
    const cur=marks.get(t.dishId);
    return effectiveState(cur?cur.state:null)!==effectiveState(t.state)||((cur&&cur.hidden)||false)!==t.hidden;
  });
  const changed=diff.length+customSteps;
  if(changed===0)return 0;
  // 差のある品だけ書き換える（ローカル処理なので即時完了）
  customDishes=payload.customDishes.map(x=>({id:x.id,name:x.name,ingredient:x.ingredient,method:x.method}));
  for(const t of diff)marks.set(t.dishId,{state:t.state,hidden:t.hidden});
  // ファイルにない自分の料理の状態行は掃除する
  const keepIds=new Set(allDishes().map(x=>x.id));
  for(const id of Array.from(marks.keys()))if(!keepIds.has(id))marks.delete(id);
  save();
  return changed;
}
function onImport(){
  const result=parseImport();
  if(result.error){importError=result.error;importDone=null;confirmImport=false;render();scrollToEl(document.getElementById("io-section"));return;}
  if(!confirmImport){importError=null;confirmImport=true;render();scrollToEl(document.getElementById("io-section"));return;}
  const changed=applyImport({marks:result.marks,customDishes:result.customDishes});
  confirmImport=false;importError=null;
  importDone=changed===0?"今の記録と差がありませんでした。そのまま使えます。":"読み込みました（"+changed+"件を変更）。マップに反映されています。";
  render();scrollToEl(document.getElementById("io-section"));
}

  countsDiv.appendChild(mkCount("手薄",thinCells().length,"マス"));
  const emptySpan=el("span");
  emptySpan.appendChild(document.createTextNode("空き "));
  const st=el("strong",null,String(emptyCells().length));emptySpan.appendChild(st);
  emptySpan.appendChild(document.createTextNode(" マス"));
  const dimS=el("span","dim"," / 36");emptySpan.appendChild(dimS);
  countsDiv.appendChild(emptySpan);
  sec.appendChild(countsDiv);
  // 凡例1
  const leg=el("div","legend");
  leg.appendChild(el("span","dim","チップをタップで切替："));
  leg.appendChild(el("span","chip-sample chip-sample-can","作れる"));
  leg.appendChild(el("span",null,"⇄")).setAttribute("aria-hidden","true");
  leg.appendChild(el("span","chip-sample chip-sample-never","作ったことない"));
  leg.appendChild(el("span","dim","／ 見出し（主材・調理法）をタップすると、その行・列をまとめて変更できます"));
  sec.appendChild(leg);
  // 凡例2（手薄・空きの定義を常時表示）
  const leg2=el("div","legend2");
  leg2.appendChild(el("span","tag-thin","手薄"));
  leg2.appendChild(el("span","dim","＝ チップはあるのに「作れる」が1品もないマス"));
  leg2.appendChild(el("span","tag-empty","空き"));
  leg2.appendChild(el("span","dim","＝ チップが1つもないマス（外したチップは数えません）"));
  sec.appendChild(leg2);
  // ボタン行
  const v=visibleDishes();
  const allCan=v.length>0&&v.every(x=>stateOf(x.id)==="can");
  const row=el("div","btn-row");
  row.appendChild(btn("btn btn-shu","手薄・空きから1マスひらく",pickRandomBlank,{disabled:blankCells().length===0}));
  row.appendChild(btn("btn "+(allCan?"btn-none":"btn-accent"),"全部切り替える："+(allCan?"全部「作ったことない」にする":"全部「作れる」にする")+"（"+v.length+"品）",toggleAllState,{
    disabled:v.length===0,
    ariaLabel:allCan?("表示中の全"+v.length+"品を全部「作ったことない」に切り替える。もう一度押すと全部「作れる」に戻る"):("表示中の全"+v.length+"品を全部「作れる」に切り替える。もう一度押すと全部「作ったことない」に戻る")
  }));
  row.appendChild(btn("btn "+(organizing?"btn-accent":"btn-surface"),organizing?"整理を終わる":"チップを整理",()=>{organizing=!organizing;render();},{ariaPressed:String(organizing)}));
  sec.appendChild(row);
  sec.appendChild(el("p","note","各マスの「＋追加」から、いつでも自分の料理を足せます。「チップを整理」では、チップを外す・戻すことに加えて、自分の料理の名前や場所を変えたり消したりできます。"));
  if(organizing)sec.appendChild(el("p","note","整理中：定番チップをタップするとマップから外れます。自分の料理のチップをタップすると、名前・場所の変更と削除ができます。行・列の見出しからは、その行・列をまとめて外す／戻すこともできます。外したチップは下のリストからも戻せます。"));
  return sec;
}
function renderDesktopMap(){
  const wrap=el("div","desktop-map");
  const grid=el("div","grid-map");
  grid.style.gridTemplateColumns="2.75rem repeat(6, minmax(0, 1fr))";
  grid.appendChild(el("div"));
  for(const met of METHODS){
    const cellWrap=el("div");
    cellWrap.appendChild(lineHeaderButton({axis:"method",lineId:met.id},met,"head-btn head-col",false));
    grid.appendChild(cellWrap);
  }
  for(const ing of INGREDIENTS){
    grid.appendChild(lineHeaderButton({axis:"ingredient",lineId:ing.id},ing,"head-row",true));
    for(const met of METHODS){
      const cw=el("div");
      cw.appendChild(renderCell({ingredient:ing.id,method:met.id}));
      grid.appendChild(cw);
    }
  }
  wrap.appendChild(grid);
  return wrap;
}
function renderMobileMap(){
  const wrap=el("div","mobile-map");
  wrap.appendChild(el("p","ov-note","行＝主材、列＝調理法です。まず全体マップで色のついていないマスを確認し、下の明細でチップを切り替えてください。見出しをタップすると行・列をまとめて変更できます。"));
  const grid=el("div","grid-map");
  grid.style.gridTemplateColumns="2.25rem repeat(6, minmax(0, 1fr))";
  grid.setAttribute("aria-label","全体マップ（行は主材、列は調理法）");
  grid.appendChild(el("div"));
  for(const met of METHODS){
    grid.appendChild(btn("ov-head",met.label,()=>openLine({axis:"method",lineId:met.id}),{ariaLabel:met.label+"の列をまとめて変更"}));
  }
  for(const ing of INGREDIENTS){
    grid.appendChild(btn("ov-rowhead",ing.label,()=>openLine({axis:"ingredient",lineId:ing.id}),{ariaLabel:ing.label+"の行をまとめて変更"}));
    for(const met of METHODS){
      const cell={ingredient:ing.id,method:met.id};
      const ds=dishesInCell(cell);
      const empty=ds.length===0;
      const thin=!empty&&isThin(cell);
      const canCount=ds.filter(x=>stateOf(x.id)==="can").length;
      const selected=picked&&picked.ingredient===ing.id&&picked.method===met.id;
      const b=btn("ov-cell "+(empty?"ov-empty":thin?"ov-thin":"ov-can")+(selected?" ov-selected":""),empty?"空":thin?"―":String(canCount),()=>openPicked(cell),{
        ariaLabel:cellLabel(ing.id,met.id)+"："+(empty?"空き（チップなし）":thin?"手薄（作れる品なし）":"作れる"+canCount+"品")+"。詳細を見る"
      });
      grid.appendChild(b);
    }
  }
  wrap.appendChild(grid);
  wrap.appendChild(el("p","ov-caption","数字＝そのマスで「作れる」品数／「―」＝手薄（チップはあるが作れる品なし）／「空」＝空き（チップなし）。マスをタップすると検索キーワードが出ます。"));
  // 明細
  const list=el("div","detail-list");
  for(const ing of INGREDIENTS){
    const rowDishes=visibleDishes().filter(x=>x.ingredient===ing.id);
    const rowCan=rowDishes.filter(x=>stateOf(x.id)==="can").length;
    const rowThin=METHODS.filter(met=>isThin({ingredient:ing.id,method:met.id})).length;
    const rowEmpty=METHODS.filter(met=>isEmpty({ingredient:ing.id,method:met.id})).length;
    const section=el("section");section.setAttribute("aria-label",ing.label+"の明細");
    const head=el("div","detail-head");
    const h3=el("h3");
    h3.appendChild(lineHeaderButton({axis:"ingredient",lineId:ing.id},ing,"",false));
    head.appendChild(h3);
    head.appendChild(el("span","meta","作れる "+rowCan+"品 ・ 手薄 "+rowThin+"マス ・ 空き "+rowEmpty+"マス ・ 見出しタップで行をまとめて変更"));
    section.appendChild(head);
    const box=el("div","detail-box");
    for(const met of METHODS){
      const rowEl=el("div","detail-row");
      rowEl.appendChild(btn("detail-method",met.label,()=>openLine({axis:"method",lineId:met.id}),{ariaLabel:met.label+"の列をまとめて変更"}));
      const cw=el("div","detail-cellwrap");
      cw.appendChild(renderCell({ingredient:ing.id,method:met.id}));
      rowEl.appendChild(cw);
      box.appendChild(rowEl);
    }
    section.appendChild(box);
    list.appendChild(section);
  }
  wrap.appendChild(list);
  return wrap;
}
function renderHiddenSection(){
  const hidden=hiddenDishes();
  if(!organizing&&hidden.length===0)return null;
  const sec=el("section","section");sec.setAttribute("aria-label","外したチップ");
  sec.appendChild(el("h2",null,"外したチップ"));
  if(hidden.length===0){
    sec.appendChild(el("p","note","外したチップはありません。")).style.fontSize=".875rem";
  }else{
    const ul=el("ul","hidden-list");
    for(const dish of hidden){
      const li=el("li");
      const b=btn(null,null,()=>setHiddenFlags([dish.id],false),{ariaLabel:dish.name+"をマップに戻す"});
      b.appendChild(document.createTextNode(dish.name));
      const s=el("span","dim","（"+ingredientOf(dish.ingredient).label+"×"+methodOf(dish.method).label+"）");
      b.appendChild(s);
      b.appendChild(document.createTextNode(" ↩ 戻す"));
      li.appendChild(b);
      ul.appendChild(li);
    }
    sec.appendChild(ul);
  }
  return sec;
}
function renderIO(){
  const sec=el("section","section section-io");sec.id="io-section";sec.setAttribute("aria-label","記録の書き出しと読み込み");
  sec.appendChild(el("h2",null,"記録をファイルに残す・戻す"));
  sec.appendChild(el("p","note","いまの分類（作れる／作ったことない）と外したチップの情報に加えて、追加した自分の料理もJSONで書き出して保存できます。戻すときは、ファイルを選ぶか、JSONを貼り付けてください。記録はこの端末の中にだけ保存されるので、機種変更やブラウザのデータ消去に備えて、ときどき書き出しておくのがおすすめです。")).style.fontSize=".875rem";
  // 書き出し
  const exWrap=el("div");exWrap.style.marginTop="1rem";
  exWrap.appendChild(el("h3",null,"書き出し"));
  const exRow=el("div","btn-row");
  exRow.appendChild(btn("btn btn-accent","JSONを書き出す",onExport));
  if(exportJson){
    exRow.appendChild(btn("btn btn-surface","ファイルにダウンロード",onDownloadJson));
    const cb=btn("btn btn-surface",exportCopied?"コピーしました":"JSONをコピー",onCopyExportJson);
    cb.id="copy-export-btn";
    exRow.appendChild(cb);
  }
  exWrap.appendChild(exRow);
  if(exportError){const p=el("p","alert",exportError);p.setAttribute("role","alert");exWrap.appendChild(p);}
  if(exportJson){
    const lab=el("label","sr-only","書き出したJSON");lab.setAttribute("for","export-json-text");exWrap.appendChild(lab);
    const ta=el("textarea","json");ta.id="export-json-text";ta.readOnly=true;ta.value=exportJson;ta.rows=8;
    exWrap.appendChild(ta);
    exWrap.appendChild(el("p","note","端末によってはダウンロードがファイルにならないことがあります。その場合は、このJSONをコピーしてメモなどに貼って保存してください。"));
  }
  sec.appendChild(exWrap);
  // 読み込み
  const imWrap=el("div");imWrap.style.marginTop="1.5rem";
  imWrap.appendChild(el("h3",null,"読み込み"));
  imWrap.appendChild(el("p","note","読み込むと、今の記録と比べて違うところだけを書き換えます。ファイルに含まれない品は初期状態（作ったことない・表示）に戻り、ファイルにない自分の料理は消えます。今の記録と差がなければ、その旨を表示して終わります。形式が違うJSONは読み込まず、今の記録は壊れません。"));
  const fileRow=el("div","btn-row");
  const fileInput=el("input");fileInput.type="file";fileInput.accept=".json,application/json";fileInput.setAttribute("aria-label","読み込むJSONファイル");fileInput.hidden=true;
  fileInput.addEventListener("change",()=>{onPickImportFile(fileInput.files&&fileInput.files[0]);fileInput.value="";});
  fileRow.appendChild(btn("btn btn-surface","JSONファイルを選ぶ",()=>fileInput.click()));
  fileRow.appendChild(fileInput);
  imWrap.appendChild(fileRow);
  const lab2=el("label","sr-only","読み込むJSONを貼り付け");lab2.setAttribute("for","import-json-text");imWrap.appendChild(lab2);
  const ta=el("textarea","json");ta.id="import-json-text";ta.rows=6;ta.placeholder="ここに書き出したJSONを貼り付けても読み込めます";ta.value=importText;
  ta.addEventListener("input",()=>{
    importText=ta.value;importError=null;importDone=null;
    if(confirmImport){confirmImport=false;render();return;}
    // 再描画すると入力中のフォーカスが外れるため、ボタンの有効・無効だけを直接切り替える
    const ib=document.getElementById("import-start-btn");
    if(ib)ib.disabled=ta.value.trim().length===0;
    const ae=document.querySelector('#io-section [role="alert"]');if(ae)ae.remove();
    const se=document.querySelector('#io-section [role="status"]');if(se)se.remove();
  });
  imWrap.appendChild(ta);
  if(importError){const p=el("p","alert",importError);p.setAttribute("role","alert");imWrap.appendChild(p);}
  if(importDone){const p=el("p","status-ok",importDone);p.setAttribute("role","status");imWrap.appendChild(p);}
  if(confirmImport){
    const cr=el("div","confirm-row");cr.style.marginTop=".5rem";
    cr.appendChild(el("p",null,"読み込んだ内容に合わせて、今の記録との差分を書き換えます。よろしいですか？"));
    cr.appendChild(btn("btn btn-shu","置き換える",onImport));
    cr.appendChild(btn("btn btn-surface","やめる",()=>{confirmImport=false;render();scrollToEl(document.getElementById("io-section"));}));
    imWrap.appendChild(cr);
  }else{
    const b=btn("btn btn-accent","読み込んで置き換える",onImport,{disabled:importText.trim().length===0});
    b.id="import-start-btn";
    b.style.marginTop=".5rem";
    imWrap.appendChild(b);
  }
  sec.appendChild(imWrap);
  return sec;
}
function renderReset(){
  const sec=el("section","reset-zone");
  if(confirmReset){
    const cr=el("div","confirm-row");
    cr.appendChild(el("p",null,"分類と整理の記録をすべて消しますか？（全部「作ったことない」に戻り、追加した自分の料理も消えます）"));
    cr.appendChild(btn("btn btn-shu","消す",doReset));
    cr.appendChild(btn("btn btn-surface","やめる",()=>{confirmReset=false;render();}));
    sec.appendChild(cr);
  }else{
    sec.appendChild(btn("linklike linklike-dim","記録をすべて消して最初から",()=>{confirmReset=true;render();}));
  }
  return sec;
}
function render(){
  const app=document.getElementById("app");
  app.textContent="";
  app.appendChild(renderHeader());
  const lp=renderLinePanel();if(lp)app.appendChild(lp);
  const ap=renderAddPanel();if(ap)app.appendChild(ap);
  const ep=renderEditPanel();if(ep)app.appendChild(ep);
  const pp=renderPickedPanel();if(pp)app.appendChild(pp);
  const mapSec=el("section","map-section");mapSec.setAttribute("aria-label","料理マップ");
  mapSec.appendChild(renderDesktopMap());
  mapSec.appendChild(renderMobileMap());
  app.appendChild(mapSec);
  const hs=renderHiddenSection();if(hs)app.appendChild(hs);
  app.appendChild(renderIO());
  app.appendChild(renderReset());
}

/* ===== 初期化 ===== */
load();
render();
</script>
</body>
</html>
